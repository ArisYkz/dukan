services:
  postgres:
    image: postgres:17-alpine
    container_name: qalta-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    container_name: qalta-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-app}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
    restart: "no"

  functions:
    build:
      context: .
      dockerfile: Dockerfile.functions
    container_name: qalta-functions
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project-ref.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-replace-me}
    ports:
      - "54321:54321"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: qalta-frontend
    depends_on:
      - functions
    ports:
      - "8080:8080"

volumes:
  postgres_data:
